root: "../out"
schema_version: 1

# Dataset cross-comparto: unisce tutti i comparti (PRO, REG, SAN, UNI)
# di entrate e uscite in una vista unica.
# Non ha raw/clean — legge direttamente dai mart di entrate/uscite.

dataset:
  name: "siope_cross_comparto"
  years: [2021, 2022, 2023, 2024, 2025, 2026]

mart:
  tables:
    - name: "siope_bilancio_unificato"
      sql: "sql/mart_bilancio_unificato.sql"
  required_tables: ["siope_bilancio_unificato"]
  validate:
    table_rules:
      siope_bilancio_unificato:
        min_rows: 500000
        required_columns:
          - lato
          - codice_comparto
          - anno
          - periodo
          - codice_ente
          - codice_voce
          - codice_istat_comune
          - denominazione_ente
          - tipo_ente
          - codice_provincia
          - provincia
          - regione
          - codice_comparto
          - is_titolo_9
          - descrizione_codice
          - has_codgest_match
          - importo
          - importo_eur
        primary_key: ["lato", "codice_comparto", "anno", "periodo", "codice_ente", "codice_voce"]

validation:
  fail_on_error: true
