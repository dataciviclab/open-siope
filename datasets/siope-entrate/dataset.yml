root: "../../out"
schema_version: 1

dataset:
  name: "siope_entrate"
  source_id: "siope"
  tags: [finanza-pubblica, siope, entrate, bilancio, enti-pubblici]
  category: finanza-pubblica
  description: "Entrate mensili di tutti gli enti pubblici italiani (comuni, regioni, ASL, universita') dal 2021 — importi per codice SIOPE, arricchite con anagrafica enti e territorio."
  years: [2021, 2022, 2023, 2024, 2025, 2026]

raw:
  extractor:
    type: "unzip_first_csv"
  sources:
    - name: "siope_entrate_open"
      type: "http_file"
      args:
        url: "https://www.siope.it/documenti/siope2/open/last/SIOPE_ENTRATE.{year}.zip"
        filename: "SIOPE_ENTRATE.{year}.zip"
      primary: true
    # Anagrafica SIOPE vive nei support dataset separati sotto `support/`.

clean:
  sql: "sql/clean.sql"
  read:
    mode: "latest"
    header: false
    delim: ","
    encoding: "utf-8"
    columns:
      column0: "VARCHAR"
      column1: "VARCHAR"
      column2: "VARCHAR"
      column3: "VARCHAR"
      column4: "VARCHAR"
  required_columns:
    - codice_ente
    - anno
    - periodo
    - codice_voce
    - importo
    - importo_eur
    - denominazione_ente
    - tipo_ente
    - codice_istat_comune
    - codice_provincia
    - provincia
    - regione
    - codice_comparto
    - descrizione_comparto
    - is_titolo_9
    - macro_categoria
    - descrizione_codice
    - has_codgest_match
  validate:
    # Gate anticorruzione: soglia bassa per non bloccare anni parziali.
    # Il gate qualitativo vero è in verify_output.py (proporzionale per anno in corso).
    min_rows: 200000
    primary_key: ["codice_ente", "anno", "periodo", "codice_voce"]
    not_null: ["codice_ente", "anno", "periodo", "codice_voce", "importo"]

mart:
  tables:
    - name: "mart_anno_comparto"
      sql: "sql/mart_anno_comparto.sql"
    - name: "mart_ente"
      sql: "sql/mart_ente.sql"
  required_tables:
    - "mart_anno_comparto"
    - "mart_ente"
  validate:
    table_rules:
      mart_anno_comparto:
        min_rows: 50
        required_columns: ["anno", "codice_comparto", "macro_categoria", "is_titolo_9", "importo_eur", "n_enti", "n_voci"]
        primary_key: ["anno", "codice_comparto", "macro_categoria", "is_titolo_9"]
        not_null: ["anno", "codice_comparto", "importo_eur"]
      mart_ente:
        min_rows: 8000
        required_columns: ["anno", "codice_ente", "denominazione_ente", "totale_eur", "codice_comparto", "regione"]
        primary_key: ["anno", "codice_ente"]
        not_null: ["anno", "codice_ente"]

validation:
  fail_on_error: true

support:
  - name: "comparti"
    config: "../../support/anag-comparti/dataset.yml"
    years: [2026]
  - name: "sottocomparti"
    config: "../../support/anag-sottocomparti/dataset.yml"
    years: [2026]
  - name: "enti"
    config: "../../support/anag-enti/dataset.yml"
    years: [2026]
  - name: "codgest_entrate"
    config: "../../support/anag-codgest-entrate/dataset.yml"
    years: [2026]
  - name: "regprov"
    config: "../../support/anag-reg-prov/dataset.yml"
    years: [2026]
